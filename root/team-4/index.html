<!doctype html>
<html class="no-js" lang="">
<head>
  <meta charset="utf-8">
  <title>Data story with flourish</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="how-to-make-a-story">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              “Team 4: Elder abuse”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>
          </div>
        </div>
      </div> -->


    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {
          section: "Rebecca",
          url: "https://flo.uri.sh/story/3647616/embed",
          steps: [
            "Hong Kong's Ageing Acceleration",
            "Hong Kong has witnessed a rapid ageing trend over the past decade. The proportion of people aged 65 and above in the total population has ket rising, marking an irreversible shift towards super-aged society.",
            "Hong Kong's aging population ratio over the past decade",
            "Geographically, elderly care homes are distributes across Hong Kong, yet their concentration does not fully matc the density of the elderly population, leading to unequal service accessibility in some districts.",
            "All elderly care homes in Hong Kong",
            "A more critical issue is the widening supply-demand gap. While the elderly population has grown substantially, the increase in care workers has lagged far behind. The fast-expanding demand for elderly care is not met by the slow growth in the nursing workforce.",
            "The number of people aged 65 and above and the number of caregivers in Hong Kong over the past decade",
            "This contrast highlight the mounting pressure on Hong Kong's elderly care system. As ageing accelerates, the supply of care manpower fails to keep pace with rising demand. Strengthening workforce planning and service distribution is essential to improve care quality and support for the elderly.",
            "Thank you"
          ]
        },
        {
          section: "Zoey",
          url: "https://flo.uri.sh/story/3652164/embed",
          steps: [
            "Elder Abuse Case：Reporting to Police vs Non—Reporting（2021——2024）: A rising underreporting crisis in Hong Kong‘s elder protection system. Data source：Legislative Council secretariat，HKSAR（February2026）",
            "There has been a worrying change in the reporting of elderly abuse cases in Hong Kong from 2021 to 2024. Data shows that the proportion of elderly abuse cases that have not been reported to the police is increasing year by year: 20.6% in 2021, 22.9% in 2022, 24.5% in 2023, and has grown to 32.9% by 2024. <br/><br/>This means that out of every three cases of elder abuse discovered, one case has not been reported to the police. There are two key reasons behind this trend. Firstly, many abusers are family members or daily caregivers of the elderly, who can only choose to remain silent due to fear of retaliation and lack of care. Secondly, Hong Kong has not yet implemented mandatory reporting regulations for elder abuse, lacking clear institutional constraints, which makes it difficult to push for many discovered cases to be reported to the police. <br/><br/>These unreported cases mostly involve hidden mental abuse or economic exploitation, which is the most easily overlooked part of the issue of elder abuse. The data reminds us that in order to truly protect the elderly, it is not only necessary to discover individual cases, but also to solve their dilemma of not daring or unwilling to report"
          ]
        },
        {
          section: "Christy",
          url: "https://flo.uri.sh/story/3657506/embed",
          steps: [
            "<b>The government had done an obvious amelioration Elderly Nursing Home</b><br/><br/>After the started subsidy project in 2019, the number of warning notices and criminal records have decreased significantly.",
            "<b>The massive hidden concern about Elderly Abuse issues in Hong Kong’s Nursing Home  have never been changed  from 2017 to now.</b><br/><br/>Although the number of elderly abuse crimes in nursing homes decreased gradually,the number of warnings showing potential risk of elderly abuse  issues still have not significantly changed."
          ]
        }


      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
