  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              Team 8: Overview of Blood Donation”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>
          </div>
        </div>
      </div> -->


    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {

            "slide 4",
            "slide 5",
            "COVID-19 increased overseas travel by the public after the pandemic, and the need to temporarily defer donations after returning from regions with mosquito-borne disease outbreaks.",
            "In 2024, the number of blood donors in Hong Kong has dropped to about 127,900, a 24% decrease compared to 10 years ago."
          ]
        },
        {
          section: "Jacky",
          url: "https://flo.uri.sh/story/3652727/embed",
          steps: [
            "The number of male blood donors has long exceeded that of females",
            "Hong Kong blood donation people male is significantly more than female, This phenomenon is partly due to women being more prone to iron deficiency, resulting in a higher rate of needing to temporarily defer blood donation.",
            "The Blood Transfusion Service Centre therefore provides qualified donors with free oral iron supplements to help them maintain regular blood donation.",
            "So, I suggest the government can more encourage female blood donors for the sustainable of Hong Kong's blood donation system",
            "For the continued development of Hong Kong's blood donation system we should encourage female blood donors.",
          ]
        },
        {
          section: "James",
          url: "https://flo.uri.sh/story/3652673/embed",
          steps: [
            "Age Distribution of Blood Donors in Hong Kong (2014–2024) The age structure of blood donors in Hong Kong has shifted over the past decade, with young donors declining sharply while middle‑aged groups have become the main contributors",
            "Sharp Drop in Young Donors In 2014, 45% of donors were aged 16–30. By 2024, this figure fell to only 17%. This dramatic decline highlights the challenge of recruiting younger donors.",
            "Middle‑Aged Donors Become the Majority Line chart or stacked bar highlighting 41–50 and 51–60. Meanwhile, donors aged 41–50 increased from 19% in 2014 to 29% in 2024. Together with the 51–60 group, middle‑aged donors now account for nearly half of all donations.” • Annotation: Label “Main donor group",
            "Donors vs General Population (2024) Comparison bar chart (two sets side by side: donors vs HK population). When compared with Hong Kong’s population structure in 2024, we see a mismatch. Donors are concentrated in the 31–60 age range, while the general population has a much larger share of people aged 61–75. This shows growing reliance on older donors.",
            "Reuse stacked bar chart or highlight key numbers. To summarize: young donors are declining, middle‑aged donors dominate, and reliance on older donors is increasing. This raises concerns about the long‑term sustainability of Hong Kong’s blood supply. Strategies to attract younger donors are urgently needed",
            "slide 6",
            "slide 7",
            "slide 8"
          ]
        },
        {
          section: "Raku",
          url: "https://flo.uri.sh/story/3652677/embed",
          steps: [
            "How hard is it to find a Blood Donation Spot near you in Hong Kong?",
            "At present, the Blood Transfusion Service has set up 11 fixed blood donation centres across the 18 districts of Hong Kong, making it convenient for the public to donate blood.",
            "slide 3",
            "slide 4",
            "slide 5"
          ]
        },
        {
          section: "Alan",
          url: "https://flo.uri.sh/story/3652680/embed",
          steps: [
            "Blood demand in Hong Kong public hospitals' specialist departments",
            "All donated blood undergoes thorough processing, separating it into different blood components (such as red blood cells, platelets, and white blood cells) to meet patients' transfusion needs. Red blood cells are one of the main sources of blood for hospitals, and many departments rely on them.",

          ]
        },
        {
          section: "Ella",
          url: "https://flo.uri.sh/story/3658861/embed",
          steps: [
            "Conclusion & Summary",
            "Declining Donors: The number of blood donors dropped to approximately 127,900 in 2024, a 24% decrease compared to ten years ago.",
            "Low Participation Rate: Hong Kong's donation rate stands at 1.7% of the total population, which is lower than South Korea (2.4%), Australia (2.2%), and significantly behind Japan (4.0%).",
            "Reliance on Repeat Donors: Repeat donors accounted for 91% of the supply in 2024, as the recruitment of first-time donors dropped from 15% to 9% over the decade.",
            "Gender Gap: Male donors consistently outnumber female donors, partly because women are more likely to be deferred due to iron deficiency.",
            "Aging Donor Base: There is a significant decline in young donors; the proportion of donors aged 16–30 fell from 45% in 2014 to just 17% in 2024.",
            "Primary Channels: Fixed donation stations remain the main collection point, accounting for 84.2% of the total volume in 2023.",
            "Clinical Demand: Over half (51.3%) of red blood cells are used by the Medicine and Geriatrics specialty, followed by Surgery (22.5%) and Orthopaedics (7.3%).",
            "To address the blood supply shortage, the community should focus on recruiting younger donors through school outreach and social media while helping more women stay eligible to donate through iron supplements, ultimately building a habit of regular giving to ensure hospitals have enough blood for elderly patients.",
          ]
        }

      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
