  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              Team 1: Animal welfare and management”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>

        </div>

    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {

          steps: [

            "According to a survey conducted in 2016, almost all of the 146 private veterinary clinics in Hong Kong. The number of veterinary clinics in Hong Kong has increased by 20% to 200 in 2024 but there are decreased to 186 in 2025.<br/><br/>A medical group with a listed company has joined the battlefield and acquired small veterinary clinics.",

            "Why are veterinary fees so high in Hong Kong?",
            "1. Market pricing for private entities<br/>2. Chain clinic mergers and acquisitions and market pricing strategies<br/>3. A shortage of manpower",
            "<b>Conclusion</b><br/><br/>The veterinary fees of veterinary clinics are indeed a concern for many pet owners.<br/><br/>Building a good relationship of trust with vet and maintaining communication is a key solution for pet and pet owners. Also I hope Hong Kong clinics can recruit more local talents to balance foreign talents, which can increase the employment opportunities of local students."
          ]
        },
        {
          section: "Ip Sum Yin",
          url: "https://flo.uri.sh/story/3658815/embed",
          steps: [
            "How COVID-19 Reshaped Hong Kong's Pet Landscape",
            "Hong Kong has always had a strong pet-keeping culture, and dogs have always been the favourite pets for local households.<br/><br/>The COVID-19 pandemic completely disrupted this routine. Lockdowns and more time at home drove a huge rise in people adopting companion animals.",
            "This initial dashboard reflects the stable <b>pre-pandemic</b> situation in 2017-2019.<br/><b>In these 3 years:</b><br/>The number of dogs was consistently much higher than cat numbers.<br/>Overall growth was slow and predictable.<br/>Public preference for dogs was overwhelming, with no real changes in the pet culture.<br/>From the chart, it shows that both dog and cat population grew gently year on year.",
            "<b>The Turning Point of 2020</b><br/><br/>This long-term stable and predictable behavior was fully disrupted and shattered once the COVID-19 pandemic had taken hold world-wide in 2020.<br/><br/>Trends in pet ownership started to change in unpredictable directions as daily life and work routines were disrupted. The second chart includes the pandemic peak period as well as the post-pandemic years up to 2023.",
            "This timeline chart reveals two completely different and diverging long-term treads for dogs and cats:<br/><br/>1. At the height of the pandemic, cat and dog ownership soared to new record highs in both the number and rate of pet acquisition.<br/><br/>2. When pandemic restrictions lifted and life slowly got back to normal:<br/><br/>Dogs ownership declined precipitously year over year nearly coming back down to its original pre-pandemic baseline level.<br/><br/>Ownership of cats, by contrast, barely decreased at all. It remained stable at this new, much higher level on a permanent basis.",

            "After any adoption boom, there is a long term responsibility. Whichever you opt cat or dog, having a pet is a commitment for life. We need to always ponder in adoption, be responsible pet keepers, and love our pet throughout their entire lives. Every animals deserves a loving, forever home."

        },

            "Overall, the adoption rate and abandonment number had been improved. They stated an opposite trending.",
            "In conclusion, problem of pet adoption and abandonment have been improved year by year, however it is still insufficient on pet protection and lack of awareness of being a responsible pet owner. As we can see that people pay less attention to pet and large amount of abandonment after the pandemic.<br/><br/>Abandonment not only causes problem of stray animals, but also makes innocent lives suffer pain. Adopt instead of buying and be responsible instead impulsive. Every life deserves to be treated gently.",
            "<b>The END</b><br/><br>Thank you for Watching  "
          ]
        }

      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
