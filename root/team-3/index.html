<!doctype html>
<html class="no-js" lang="">
<head>
  <meta charset="utf-8">
  <title>Data story with flourish</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="how-to-make-a-story">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              “Team 3: Elderly”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>
          </div>
        </div>
      </div> -->


    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {
          section: "Jack",
          url: "https://flo.uri.sh/story/3652701/embed",
          steps: [
            "Elder abuse in Hong Kong",
            "<b>Introduction</b><br/><br/>The elderly are a vital part of society, and elder abuse is a serious problem in Hong Kong.<br/><br/>However, contrary to its severity, this problem has not received much attention in Hong Kong. Many cases and situations have not been properly handled or resolved.<br/><br/>Hopefully, after reviewing the data in this report, people will understand the seriousness of this issue and take it seriously.",
            "In 2021, the percentage of unreported elderly abuse cases is 20.6%. Which means every 10 cases there will be 2 of it are not being handles.",
            "However, the percentage of unreported elderly abuse cases are increasing year by year. In 2024 the percentage is already increasing to 32.9%. Which means that in this 4 years the percentage has been increased 12.3%. 20.6% in 2021 and 32.9% in 2024.",
            "Although the total amount of elderly abuse cases are decreasing, the percentage of the unreported cases are increasing very quickly like a rocket. Even the members of public had previously advocated for a mandatory reporting mechanism for suspected cases of elder abuse, but the government are choosing to do the child mandatory reporting mechanism first and postpone the elderly abuse mandatory reporting mechanism. The lack of attention given to the elderly in society is the main reason for this outcome.",
            "By investigating the relationship between abused elderly people and their abusers, as well as the ratio of reported to unreported cases we can discover that as close as the relationship between the abused elderly and the abuser in 2025, the elderly will be more likely to report the abuser",
            "By the data in 2025, we can find out that no matter are the total amount of cases of elderly abuse or the percentage of unreported cases, the majority of victims are all female elderly. The percentage of unreported cases in male victims are 17.2%, but 22.9% in female elderly cases.",
          ]
        },
        {
          section: "Gigi",
          url: "https://flo.uri.sh/story/3652681/embed",
          steps: [
            "n 2019, the government launched a five-year funding scheme for private nursing homes , which they call \"Private Nursing Home Accreditation and Funding Program\" .<br/><br/>Until March 2024, 55% of private nursing homes participated in it. This program is to take care for elderly people aged 65 or above who are unable to live at home , to provide them with accommodation care services and facilities. This should allow more elderly people to be cared for, but the warning letters received by nursing homes have not significantly decreased.",
            "From 2017-2018 to 2024-2025, the conviction of abused elderly has decreased by 65.2%.<br/><br/>In theory, a decrease in elder abuse convictions shows the chances of elderly being abused in nursing homes are also decreased . But, the number of warning letters received by nursing homes are not shows that are not as they appear.",
            "However, the warning letters from nursing homes are only decreased by 29.1%.<br/><br/>Despite 55% of private nursing homes participating in the program to assist in providing services and prevent a recurrence of cases like the 2015 nursing home abuse scandal that garnered widespread public attention, why have convictions decreased by 65% ​​while warning letters have only decreased by nearly 30%?",
            "Although the number of convictions have decreased from double digits to single digits , the number of warning letters are kept within hundreds.<br/><br/>The rates of decline in warning letters and conviction differed significantly. The gap between actual figures and estimated values may  conceal unproven issues of elder abuse.",
          ]
        },
        {
          section: "Alice",
          url: "https://flo.uri.sh/story/3652703/embed",
          steps: [
            "Over the past decade, elderly abuse in Hong Kong has decreased significantly.<br/><br/>In 2015, there were as many as 557 cases of elderly abuse in Hong Kong. By 2024, this number had dropped to 283, a reduction of nearly half. A clear downward trend can be seen over the ten years.",
            "However, while cases of elder abuse have decreased, the proportion of physical abuse continues to rise. <br/><br/>Physical abuse of the elderly in Hong Kong is projected to increase from 64.5% in 2015 to 74.6% in 2024. Elderly physical abuse cases have consistently accounted for over 60% of all cases, and this proportion continues to rise, indicating insufficient attention to physical abuse.",
            "In addition, we found that the rate of abuse among elderly women in Hong Kong has also increased. In 2015, the rate of abuse among elderly women in Hong Kong was 61.8%, while it is expected to rise to 74.5% in 2024, indicating that elderly women are more vulnerable to abuse.<br/><br/>Therefore, as things stand, physical abuse is becoming increasingly serious, especially against women, and there is a lack of adequate measures and attention in this regard."
          ]
        },
        {
          section: "Tracy",
          url: "https://flo.uri.sh/story/3652704/embed",
          steps: [
            "<b>Relationship of Perpetrators</b><br/><br/>This stacked bar chart shows the relationship between perpetrators and abused elders. From 2015 to 2018, most of the elderly abuse cases came from someone other instead of their family member.After 2021, this phenomenon has changed; family members have become the main perpetrators, and the trend to grow continued.",
            "<b>Number of Reported Cases<br/><br/>The total number of reported cases has fallen from 557 in 2015 to 283 in 2024.</b><br/><br/>On the surface, the data shows a significant decrease in cases of elder abuse. It didn't mean that elderly abuse becomes well. Abuse nowadays is becoming more hidden; it has become difficult to discover.",
            "<b>Percentage of family perpetrators</b><br/><br/>The proportion of family perpetrators sharply increased from 2015, 21.5% jump to 2024, 74.6%. This confirmly show that elderly abuse in Hong Kong has become a major family issue."
          ]
        },
        {
          section: "Chan Chun Hei Aidan",
          url: "https://flo.uri.sh/story/3652700/embed",
          steps: [
            "In recent years, Hong Kong has been facing population ageing. Although the cases of elder abuse are decreasing, some hidden risks are approaching. Due to this reason, the probability of elder abuse may increase.",
            "According to data from the Census and Statistics Department in August 2025, the total number of households and double-elderly residents continues to increase.<br/><br/>It reflects three factors:<br/><br/>1. The ageing population is becoming increasingly serious, a large number of middle-aged people in their forties and fifties are entering old age. People are starting to retire, and this also reflects that social productivity is gradually decreasing.",
            "The number of elderly couples living alone without other family members is projected to surge by 75.6% from 161,100 households in 2015 to 282,900 households in 2024. In contrast, the overall number of households in Hong Kong will only increase by 11.8% during the same period.<br/><br/>Therefore, it is proven that the increasing of double-elderly residents is related to population ageing.",
            "2. And the sons of these 40-50-year-olds have grown up and started their own families, which has increased the total number of households.",
            "3. The number of elderly residents is increasing. They may encounter controversies in their life, such as a housework problem. In the long term, it may lead to having grudges between them. When they have reached a limit, elder abuse will happen. Therefore, it may increase the probability of elder abuse.",
            "In 2024, the total number of elderly residents was 282,900. Until 2025 August, there are around 40% (112,000) elderly residents who use this hotline. It reflects that many elderly caregivers are stressful. Therefore, the probability of elder abuse may increase.",
            "In just four months, according to the caregiver database, which was launched in July 2025, it has only provided a total of 3400 high-risk caregivers and hidden elderly. For the increasing of elderly households, the demand for the helpline (182 183) may increase.<br/><br/>However, with the increasing probability of elder abuse and the number of elderly residents, the number of elderly residents provided may not satisfy them. It shows that the government is giving insufficient attention to elderly abuse.",
            "In summary, along with the increase in double-elderly residents, the probability of elder abuse is rising. However, the resources provided by the government are insufficient to help the elderly.<br/><br/>Therefore, it is suggested that the government pay more attention to elderly abuse. For example, increase funding for supporting facilities. It is helpful when the elderly receive more help."
          ]
        }

      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
