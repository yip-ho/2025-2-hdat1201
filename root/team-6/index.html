<!doctype html>
<html class="no-js" lang="">
<head>
  <meta charset="utf-8">
  <title>Data story with flourish</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="how-to-make-a-story">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              “Team 6: <missing>”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>
          </div>
        </div>
      </div> -->


    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {
          section: "Lam Tsz Wing",
          url: "https://flo.uri.sh/story/3652710/embed",
          steps: [
            "The Hong Kong SAR government has funneled substantial public funds into infrastructure, subsidies for major events, and athlete training; yet, the local sports sector accounted for only **1.4% of GDP** in 2022. This figure remains unchanged from 2018, representing a period of stagnation. Furthermore, this share of economic output lags behind that of other advanced global economies, such as Japan, Germany, the United Kingdom, and France.",
            "slide 2",
            "slide 3",
            "slide 4",
            "slide 5"
        ]
        },{
          section: "Kuang Yuan Ning",
          url: "https://flo.uri.sh/story/3658226/embed",
          steps: [
            "Over the last seven years, Hong Kong has seen a steady rise in its elite athlete community. According to official reports, the total number of professional athletes grew from 898 in 2018 to a new peak of 1,214 in 2024. This shows that more local talents are choosing sports as their professional career path, leading to a much larger pool of athletes for the city.",
            "To keep up with this growth, government funding for the Sports Academy also surged. We can see that the annual grant increased by about 58%, reaching over HK$941.6 million by 2024. This financial support is crucial because it provides the necessary resources, like better coaching and medical care, to sustain such an expanding team.",
            "In conclusion, my chart shows a clear correlation between athlete growth and increased funding. As the team expands, the budget follows. This 'money-follows-people' approach highlights a sustainable model for Hong Kong’s sports industry, ensuring that as our team gets bigger, our support system gets stronger too."
          ]
        },{
          section: "Li Zixian",
          url: "https://flo.uri.sh/story/3652736/embed",
          steps: [
            "With increased financial investment, Hong Kong athletes have performed increasingly well at the Olympic Games. At the 2020 Tokyo Olympics, they won 1 gold, 2 silver, and 3 bronze medals, the highest number of medals Hong Kong has ever achieved in Olympic history. Subsequently, at the 2024 Paris Olympics, they won 2 gold and 2 bronze medals, showing a significant improvement in overall competition performance.",
            "slide 2",
            "slide 3",
            "slide 4",
            "slide 5"          
          ]
        },
        {
          section: "Li Zixian",
          url: "https://flo.uri.sh/story/3652723/embed",
          steps: [
            "Not only that, Hong Kong's sporting achievements at the Asian Games have also shown significant progress and improvement. At the 2022 Hangzhou Asian Games, a record-breaking total of 53 medals were won, representing a 26% increase compared to the number of medals won at the 2014 Incheon Asian Games. The overall medal count has also shown an upward trend, indicating that increased funding has a significant impact on athlete training. This is also one of the major elements in the early development of sports in Hong Kong.",
            "slide 2",
            "slide 3",
            "slide 4",
            "slide 5"          
          ]
        },
        {
          section: "Lee Cheuk In",
          url: "https://flo.uri.sh/story/3652714/embed",
          steps: [
            "Review the local elite sports and story industry development<br/><br/>The government focuses on developing and promoting and sports industry, prioritizing both popularization and elite participation.",
            "slide 2",
            "slide 3",
            "slide 4",
            "slide 5"          
          ]
        }

      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
