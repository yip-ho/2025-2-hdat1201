<!doctype html>
<html class="no-js" lang="">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">  

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #1d1d1d;
    }

    .font-secondary {
      font-family: 'Lora', serif !important;
    }

    .blockquote {
      font-size: 32px;
      font-weight: 700;
      line-height: 36px;
      text-transform: uppercase;
      text-align: center;
    }

    .scrolly__section {
      position: relative;
    }

    .scrolly__chart {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      -webkit-transform: translate3d(0, 0, 0);
      -moz-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      z-index: 0;
      padding: 0;
    }

    .scrolly__chart iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .scrolly__content {
      position: relative;
      z-index: 1;
      padding: 50vh 1rem 50vh 1rem;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .step {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .text-block.is-active {
      background-color: rgba(255, 255, 255, 0.95);
      color: black;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .text-block {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    .step p {
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

  <body>
    <div class="wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11">

            <p class="blockquote font-secondary ">
              “Team 5: Elite sports and the sports industry”
            </p>
            <!-- <img src="https://public.flourish.studio/uploads/3207879/b16a23ef-0fb3-4aff-af98-b7930f9d78a4.png" alt="placeholder" width=100% class="mb-5 py-2" />           -->
    
            <!-- <p class="text-body-2 mb-5">Assignment 02</p> -->
          </div>
        </div>
      </div>

      <div class="container-fluid" id="root">
        <!-- Scrolly sections will be generated dynamically from scrollyData -->
      </div>


      <!-- <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 col-11 text-center">
            <p class="text-body-2 mb-5">🌳 Thank you 🌳</p>
          </div>
        </div>
      </div> -->


    </div>

    <script src="https://unpkg.com/d3@5.9.1/dist/d3.min.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <script>
      // ============================================
      // CONFIGURATION
      // ============================================
      const scrollyData = [
        {
          section: "Lai Kwan Yi (Ria)",
          url: "https://flo.uri.sh/story/3652724/embed",
          steps: [
            "Overall sports policy & public spending",
            "Investing in Excellence: Decoding Hong Kong’s Sports Spending<br/><br/>As Hong Kong athletes shine on the world stage, how is the government fueling this momentum? Explore the multi-billion-dollar roadmap behind our city’s sporting ambitions.",
            "Government Sports Spending Grew 57% in Six Years (2018–2024)<br/><br/>In recent years, Hong Kong has significantly ramped up its commitment to sports. Annual public expenditure surged by 57% over six years, reaching a record HK$7.9 billion in 2024-25. This massive investment aims to transform Hong Kong into a premier sports hub through five key pillars: promotion, elite support, major events, professionalism, and industry development.",
            "Elite Athletes & HKSI Funding Increased 58% (2018–2024)<br/><br/>To maintain a competitive edge, HK$1.46 billion is dedicated to elite sports, supporting our high-performance athletes through the Hong Kong Sports Institute. Meanwhile, investment in major sporting events has seen a significant jump to HK$388 million, aiming to bring world-class spectacles like the Sevens and \"M\" Mark events back to our city.",
            "2024 Sports Budget Breakdown: Where the Money Goes<br/><br/>While gold medals grab headlines, the foundation lies in the community. Over three-quarters (77%) of the budget—approx. HK$6.07 billion—is allocated to promoting sports at the community level. By funding local venues and grassroots programs, the government aims to make \"Sports for All\" a reality for every citizen.",
            "A Future-Forward Investment<br/><br/>The steady growth in public spending reflects a shift in vision—viewing sports not just as a hobby, but as a vital industry and a source of national pride. However, as the budget grows, the focus now turns to how these resources can best support athletes’ careers and long-term industry sustainability."
          ]
        },
        {
          section: "Ho Hiu Ying (Yanice)",
          url: "https://flo.uri.sh/story/3652718/embed",
          steps: [
            "Hong Kong's medal tally is setting new records.<br/><br/>In recent years, it should be seen that there has been a change in the number of medals won by Hong Kong in various competitions around the world.<br/><br/>It does not happen suddenly due to any particular reason, but because of the accumulation of results during all those years. If one analyzes the number of medals collected, he will observe that they have kept increasing for recent editions of such competitions. However, what deserves special attention is the increase in the number of gold medals, which indicate the improvement of Hong Kong’s competitive level in different areas.The quality and number of medals confirm that Hong Kong has reached new record highs when winning medals.",
            "...",
            "...",
            "Between 2014 and 2022, the total number of medals won by Hong Kong in the Asian Games showed a continuous upward trend, proving that Hong Kong's competitiveness on the Asian stage is accelerating.",
            "The level of competition at the Olympic Games is higher than that at the Asian Games, making it more difficult to win medals. Hong Kong did not win any medals in 2016, but claimed one gold medal in 2020 and two gold medals in 2024, demonstrating continuous improvement and competitiveness on the world's top stage.",
            "Conclusion<br/><br/>From the Asian Games to the Olympics (2014–2024), Hong Kong's medals prove its sports are progressing. At the Asian Games, total medals more than tripled in eight years. At the Olympics, Hong Kong rose from zero medals in 2016 to its first gold in 2020, then two golds in 2024. More medals, more golds. This is the result of long-term effort. Hong Kong keeps achieving more, and I believe the progress will continue."
          ]
        },
        {
          section: "Ho Yee Ki(Kelly)",
          url: "https://flo.uri.sh/story/3652742/embed",
          steps: [
            "This parallel trend reflects the Hong Kong government's increasing resource allocation as the needs of retired athletes grow, ensuring they receive support for their livelihoods and career transitions after retirement.",
            "This chart shows that Hong Kong's financial investment in retired athletes increased year by year between 2018 and 2023, rising from HK$13.2 million to HK$30 million.<br/><br/>Although there was a brief dip in 2021, the overall trend remained steadily upward. This demonstrates the Hong Kong government's continued efforts to strengthen support and ensure the livelihood and development of retired athletes, reflecting society's emphasis on and commitment to them.",
            "This chart shows the change in the number of retired athletes in Hong Kong between 2018 and 2023, gradually increasing from 53 to a peak of 93, with an average of about 72 retired athletes participating in the support program each year.",

            "This parallel trend reflects the Hong Kong government's increasing resource allocation as the needs of retired athletes grow, ensuring they receive support for their livelihoods and career transitions after retirement."
          ]
        },
        {
          section: "Leung Tsz Ki (Kaite)",
          url: "https://flo.uri.sh/story/3654270/embed",
          steps: [
            "<b>Annual Spending on Retired Athlete Transition Program</b><br/><br/>From 2018 to 2023, government spending on the retired athlete transition program fluctuated significantly, with funding starting relatively high, dropping in 2020, and then rising again in 2022 and 2023, yet despite these financial adjustments, the number of participants steadily declined year after year, suggesting that increased investment alone has not been sufficient to sustain engagement or attract more athletes into the program.",
            "<b>Employment Outcomes of Retired Athletes</b><br/><br/>The data shows that the vast majority of retired athletes, 19 out of the total group, continue their careers within schools and sports institutions, highlighting how their professional expertise and experience are most often reinvested back into the sports ecosystem, while only a very small number branch out into other fields such as disciplined services, engineering, or entrepreneurship."
          ]
        },
        {
          section: "Cheung Chun Yam (Eddy)",
          url: "https://flo.uri.sh/story/3652686/embed",
          steps: [
            "<b>\"M\" Mark (Hong Kong)</b><br/><br/>Launched in 2004, it accredits and funds major international sports events, including the Hong Kong Marathon, Rugby Sevens, and World Volleyball League, to promote HK as a sports hub.",
            "2020 marked a historic low for Hong Kong’s M-Mark sports events and participation amid COVID-19, with nearly all major competitions suspended and crowds banned. By 2023, as pandemic restrictions lifted and public confidence returned, both the number of events and participants surged to record levels, showing a strong post-pandemic recovery in large-scale sports activities.",
            "<b>Hong Kong’s Sports Economy: Value Added Recovery vs. Stagnant Jobs</b><br/><br/>Hong Kong’s sports industry saw a partial economic recovery after COVID-19, but it was uneven. Value added rose from its 2020 low yet never matched 2011 levels, and employment remained stagnant, failing to bounce back at all.",
            "From 2018 to 2023, the sports GDP of Hong Kong remained consistently lower than that of Japan, Germany, the United Kingdom, and France. While these economies saw stable or growing contributions from the sports sector, even through the pandemic, Hong Kong’s share stayed at the bottom of the comparison, showing no clear sign of catching up over the six-year period.",
            "Is sports funding really enough?"
          ]
        },

      ];

      // ============================================
      // RENDER
      // ============================================
      function renderScrollySections() {
        const root = d3.select("#root");
        
        scrollyData.forEach(function(sectionData, sectionIndex) {
          // Create section wrapper
          const section = root.append("div")
            .attr("class", "row justify-content-center scrolly__section")
            .attr("id", "scrolly__section-" + sectionIndex)
            .attr("data-url-base", sectionData.url)
            .attr("data-section-index", sectionIndex);

      // Create chart column (fullscreen sticky iframe)
          section.append("div")
            .attr("class", "scrolly__chart")
            .append("iframe")
            .attr("scrolling", "no")
            .attr("allow", "fullscreen")
            .attr("src", sectionData.url + "#slide-0");

          // Create content column (steps overlay)
          const content = section.append("div")
            .attr("class", "scrolly__content");

          // Create step elements
          sectionData.steps.forEach(function(stepText, stepIndex) {
            content.append("div")
              .attr("class", "step")
              .attr("data-step", stepIndex + 1)
              .append("div")
              .attr("class", "text-block pa-2")
              .append("p")
              .html(stepText);
          });
        });
      }

      // ============================================
      // SCROLLAMA
      // ============================================
      function initScrollama() {
        scrollyData.forEach(function(sectionData, sectionIndex) {
          const sectionId = "scrolly__section-" + sectionIndex;
          const scrolly = d3.select("#" + sectionId);
          const chart = scrolly.select(".scrolly__chart");
          const content = scrolly.select(".scrolly__content");
          const step = content.selectAll(".step");

          // Create scrollama instance for this section
          const scroller = scrollama();

          function handleResize() {
            var stepH = Math.floor(window.innerHeight * 1);
            step.style("height", stepH + "px");
            scroller.resize();
          }

          function handleStepEnter(response) {
            // Get URL base from this section
            const urlBase = scrolly.attr("data-url-base");

            // Highlight current step within this section
            content.selectAll(".step .text-block").classed("is-active", function(d, i) {
              return i === response.index;
            });

            // Update this section's iframe
            chart.select("iframe").attr("src", urlBase + "#slide-" + response.index);
          }

          // Initialize this section's scrollama
          scroller
            .setup({
              step: "#" + sectionId + " .step",
              offset: 0.5,
              debug: false
            })
            .onStepEnter(handleStepEnter);

          // Store resize handler
          window["handleResize-" + sectionIndex] = handleResize;
        });

        // Global resize handler
        window.addEventListener("resize", function() {
          scrollyData.forEach(function(_, sectionIndex) {
            if (window["handleResize-" + sectionIndex]) {
              window["handleResize-" + sectionIndex]();
            }
          });
        });
      }

      // ============================================
      // INIT
      // ============================================
      function init() {
        renderScrollySections();
        initScrollama();
      }

      init();
    </script>    
  </body>
</html>
